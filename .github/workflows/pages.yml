name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verificar tipos
        run: npx tsc --noEmit

      - name: Verificar los contratos de datos
        run: |
          node scripts/test_results_contract.cjs
          node scripts/test_correlations_contract.cjs
          node scripts/test_temporal.cjs

      - name: Construir el export estático
        # En un repositorio de proyecto el sitio vive en /<repositorio>.
        # En uno de usuario (<usuario>.github.io) vive en la raíz: BASE_PATH queda vacío.
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO" == *.github.io ]]; then BASE_PATH=""; else BASE_PATH="/$REPO"; fi
          echo "BASE_PATH=$BASE_PATH"
          BASE_PATH="$BASE_PATH" npm run build

      - name: Desactivar Jekyll
        # Sin esto GitHub Pages ignora el directorio _next por empezar con guion bajo.
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
